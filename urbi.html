<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URBI – Das Städte-Quiz</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --gold: #fbbf24;
    --text: #f8fafc;
    --muted: #94a3b8;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .app { width: 100%; max-width: 820px; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }
  h1 { text-align: center; font-size: 2.2rem; letter-spacing: 3px; color: var(--gold); margin-bottom: 4px; }
  .sub { text-align: center; color: var(--muted); font-size: 0.95rem; margin-bottom: 18px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
  select, input, button {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem;
  }
  button { background: var(--accent); color: #0f172a; font-weight: 700; border: none; cursor: pointer; }
  button:active { transform: scale(0.98); }
  .btn-gold { background: var(--gold); }
.btn-sec { background: #334155; color: var(--text); }
  .stage {
    position: relative;
    width: 100%;
    height: 360px;
    border-radius: 14px;
    overflow: hidden;
    background: #020617;
    margin-bottom: 14px;
  }
  .slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
  }
  .slide.active { opacity: 1; }
  .hud {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
  }
  .badge {
    background: rgba(15, 23, 42, 0.85);
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .pts-badge { color: var(--gold); font-size: 1.1rem; }
  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .opt-btn { background: #0f172a; color: var(--text); border: 1px solid #334155; padding: 14px 10px; font-weight: 600; }
  .opt-btn.correct { background: var(--ok); color: #052e16; border-color: var(--ok); }
  .opt-btn.wrong { background: var(--err); color: #fff; border-color: var(--err); }
  .scores { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .p-tag { background: #0f172a; padding: 6px 12px; border-radius: 8px; font-size: 0.9rem; border: 1px solid #334155; }
  .p-tag.turn { border-color: var(--gold); color: var(--gold); font-weight: 700; }
  .hidden { display: none !important; }
  .credits { text-align: center; font-size: 0.78rem; color: var(--muted); margin-top: 12px; }
  @media (max-width: 600px) { .stage { height: 260px; } .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <h1>URBI</h1>
  <div class="sub">Das weltweite Städte-Quiz – Vom unbekannten Viertel bis zum Wahrzeichen</div>

      <div>
        <label>Region / Kontinent</label>

      <button id="nextBtn">Nächste Stadt</button>
    </div>
  </div>
</div>

const API_DE = "https://de." + "wiki" + "pedia.org/w/api.php";
const API_EN = "https://en." + "wiki" + "pedia.org/w/api.php";
const API_CM = "https://commons." + "wiki" + "media.org/w/api.php";
let state = { players: [], turn: 0, goal: 50, opts: 6, pool: [], used: [], timer: null, step: 0, locked: false, cur: null };
const shuffle = a => [...a].sort(() => Math.random() - 0.5);
const BAD = /flag|coat|map|logo|icon|locator|blank|wappen|karte|diagram|plan|seal|arms|animal|lion|zebra|giraffe|elephant|bird|food|dish|meal|menu|restaurant|cafe|interior|room|bedroom|kitchen|bathroom|selfie|portrait|person|people|exhibit|artifact|coin|stamp|book|page|signature|graph|chart|device|machine|engine|car|bus|train|truck|phone|screen|plaque|sign|grave|poster/i;

function isSharpPhoto(info) {
  if (!info || !info.url) return false;
  const u = info.thumburl || info.url;
  if (!/\.(jpg|jpeg)/i.test(u) || BAD.test(u)) return false;
  if (info.width && info.width < 1100) return false;
  if (info.width && info.height && info.width < info.height * 1.15) return false;
  return true;
}

async function fetchCommons(q, limit = 25) {
  const hdr = { "Api-User-Agent": "URBI-Quiz/1.0 (https://ka-2.art)" };
  const u = `${API_CM}?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrnamespace=6&gsrlimit=${limit}&prop=imageinfo&iiprop=url|size&iiurlwidth=1000&format=json&origin=*`;
  try {
    const r = await fetch(u, { headers: hdr }).then(res => res.json());
    return Object.values(r.query?.pages || {}).map(p => p.imageinfo?.at(0)).filter(isSharpPhoto).map(i => i.thumburl || i.url);
  } catch (e) { return []; }
}

async function fetchLandmark(title) {
  const hdr = { "Api-User-Agent": "URBI-Quiz/1.0 (https://ka-2.art)" };
  for (const base of [API_DE, API_EN]) {
    try {
      const u = `${base}?action=query&redirects=1&titles=${encodeURIComponent(title)}&prop=pageimages&piprop=thumbnail|original&pithumbsize=1000&format=json&origin=*`;
      const d = await fetch(u, { headers: hdr }).then(r => r.json());
      const p = Object.values(d.query?.pages || {}).at(0);
      if (p?.thumbnail?.source && p?.original?.width >= 1000 && p.original.width > p.original.height && !BAD.test(p.thumbnail.source)) {
        return p.thumbnail.source;
      }
    } catch (e) {}
  }
  return (await fetchCommons(`"${title}"`, 5)).at(0) || null;
}
async function fetchCitySlides(city) {
  const q1 = `filetype:bitmap "${city.n}" (street OR district OR bridge OR square OR station OR park OR skyline) -animal -interior -museum`;
  const [distPool, lm1, lm2, lm3] = await Promise.all([
    fetchCommons(q1, 30),
    fetchLandmark(city.lm.at(0)),
    fetchLandmark(city.lm.at(1)),
    fetchLandmark(city.lm.at(2))
  ]);
  const landmarks = [...new Set([lm1, lm2, lm3].filter(Boolean))];
  let first = [...new Set(distPool)].filter(u => !landmarks.includes(u));
  first = shuffle(first).slice(0, 10 - landmarks.length);
  if (first.length + landmarks.length < 10) {
    const extra = await fetchCommons(`filetype:bitmap "${city.n}" architecture OR building OR view`, 25);
    const more = [...new Set(extra)].filter(u => !landmarks.includes(u) && !first.includes(u));
    first = [...first, ...shuffle(more)].slice(0, 10 - landmarks.length);
  }
  return [...first, ...landmarks].slice(0, 10);
}

async function fetchExtract(name) {
  try {
    const u = `${API_DE}?action=query&redirects=1&titles=${encodeURIComponent(name)}&prop=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*`;
    const d = await fetch(u).then(r => r.json());
    return Object.values(d.query?.pages || {}).at(0)?.extract || "";
  } catch (e) { return ""; }
}

function renderScores() {
  document.getElementById("scoreBar").innerHTML = state.players.map((p, i) =>
    `<div class="p-tag ${i === state.turn ? "turn" : ""}">${p.name}: ${p.pts} Pkt</div>`
  ).join("");
}

function showSlide(urls, idx) {
  const a = document.getElementById("imgA"), b = document.getElementById("imgB");
  const target = idx % 2 === 0 ? a : b, other = idx % 2 === 0 ? b : a;
  target.onload = () => { target.classList.add("active"); other.classList.remove("active"); };
  target.src = urls.at(idx);
  document.getElementById("imgCounter").textContent = `Bild ${idx + 1} / 10`;
  document.getElementById("ptsDisplay").textContent = `${10 - idx} Punkte`;
}
async function startRound(tries = 0) {
  clearInterval(state.timer); state.locked = false; state.step = 0;
  document.getElementById("infoBox").classList.add("hidden");
  document.getElementById("optGrid").innerHTML = "";
  document.getElementById("loadingTxt").classList.remove("hidden");
  document.getElementById("imgA").classList.remove("active");
  document.getElementById("imgB").classList.remove("active");
  renderScores();
  let avail = state.pool.filter(c => !state.used.includes(c.n));
  if (!avail.length) { state.used = []; avail = state.pool; }
  const city = shuffle(avail).at(0); state.used.push(city.n); state.cur = city;
  const slides = await fetchCitySlides(city);
  if (slides.length < 3 && tries < 6) return startRound(tries + 1);
  document.getElementById("loadingTxt").classList.add("hidden");
  const sameReg = CITIES.filter(c => c.n !== city.n && (c.r === city.r || (c.r.startsWith("EU") && city.r.startsWith("EU"))));
  const others = CITIES.filter(c => c.n !== city.n && !sameReg.includes(c));
  const choices = shuffle([city, ...[...shuffle(sameReg), ...shuffle(others)].slice(0, state.opts - 1)]);
  choices.forEach(ch => {
    const btn = document.createElement("button"); btn.className = "opt-btn"; btn.textContent = ch.n;
    let moved = false;
    btn.addEventListener("touchstart", () => { moved = false; }, { passive: true });
    btn.addEventListener("touchmove", () => { moved = true; }, { passive: true });
    btn.addEventListener("click", () => { if (!moved) handleGuess(ch.n, btn); });
    document.getElementById("optGrid").appendChild(btn);
  });
  showSlide(slides, 0);
  state.timer = setInterval(() => {
    state.step++;
    if (state.step < slides.length) showSlide(slides, state.step);
    else { clearInterval(state.timer); handleGuess(null, null); }
  }, 3000);
}

async function handleGuess(guess, btn) {
  if (state.locked) return; state.locked = true; clearInterval(state.timer);
  const win = guess === state.cur.n, gained = win ? (10 - state.step) : 0;
  if (win) state.players.at(state.turn).pts += gained;
  document.querySelectorAll(".opt-btn").forEach(b => {
    if (b.textContent === state.cur.n) b.classList.add("correct"); else if (b === btn) b.classList.add("wrong");
  });
  renderScores();
  document.getElementById("resTitle").textContent = win ? `Richtig! +${gained} Punkte (${state.cur.n}, ${state.cur.c})` : `Gesucht war: ${state.cur.n} (${state.cur.c})`;
  document.getElementById("resDesc").textContent = await fetchExtract(state.cur.n);
  document.getElementById("infoBox").classList.remove("hidden");
}

document.getElementById("nextBtn").addEventListener("click", () => {
  state.turn = (state.turn + 1) % state.players.length;
  if (state.turn === 0) {
    const top = Math.max(...state.players.map(p => p.pts)), leaders = state.players.filter(p => p.pts === top);
    if (top >= state.goal && leaders.length === 1) {
      alert(`Herzlichen Glückwunsch! ${leaders.at(0).name} gewinnt URBI mit ${top} Punkten!`);
      document.getElementById("gameView").classList.add("hidden"); document.getElementById("menuView").classList.remove("hidden"); return;
    }
  }
  startRound();
});

document.getElementById("startBtn").addEventListener("click", () => {
  const cont = document.getElementById("fCont").value, type = document.getElementById("fType").value;
  state.opts = Number(document.getElementById("fOpts").value); state.goal = Number(document.getElementById("fGoal").value);
  const names = document.getElementById("pInput").value.split(",").map(s => s.trim()).filter(Boolean);
  state.players = (names.length ? names : ["Spieler 1"]).map(name => ({ name, pts: 0 }));
  state.pool = CITIES.filter(c => {
    if (cont === "EU_EXT" && !c.r.startsWith("EU")) return false;
    else if (cont !== "ALL" && cont !== "EU_EXT" && c.r !== cont) return false;
    if (type === "CAP" && !c.cap) return false;
    if (type === "MIL" && !c.mil) return false;
    return true;
  });
  state.turn = 0; state.used = [];
  document.getElementById("menuView").classList.add("hidden"); document.getElementById("gameView").classList.remove("hidden");
  startRound();
});
</script>
</body>
